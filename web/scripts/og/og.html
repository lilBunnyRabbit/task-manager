<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=block" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css" rel="stylesheet">
<style>
:root {
  --bg-darkest: oklch(0.153 0.014 230.47); --bg-darker: oklch(0.187 0.0171 230.47); --bg-dark: oklch(0.221 0.0202 230.47);
  --bg: oklch(0.255 0.0233 230.47); --bg-light: oklch(0.289 0.0264 230.47); --bg-lighter: oklch(0.323 0.0295 230.47);
  --bg-lightest: oklch(0.357 0.0326 230.47); --fg: oklch(0.745 0.0078 50.47); --dim: oklch(0.745 0.0078 50.47 / 0.55);
  --primary: oklch(0.745 0.0699 122.47); --secondary: oklch(0.745 0.0466 302.47); --accent: oklch(0.745 0.0932 50.47);
  --tertiary: oklch(0.745 0.0233 176.47); --cottontail: oklch(0.949 0.0939 122.47);
  --mono: Hack, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg-darkest); font-family: Inter, sans-serif; color: var(--fg); position: relative; }
.ears { fill: var(--primary); }
.cot { color: var(--cottontail); }
.glow { position: absolute; inset: 0; pointer-events: none; }

.glow { background: radial-gradient(60% 70% at 10% 10%, oklch(0.745 0.0699 122.47 / 0.12), transparent 70%); }
.head { position: absolute; left: 72px; top: 60px; display: flex; align-items: center; gap: 18px; }
.head .ears { width: 64px; }
.head h1 { font-size: 64px; font-weight: 800; color: var(--cottontail); line-height: 1; }
.tag { position: absolute; left: 72px; top: 150px; font-size: 26px; color: var(--fg); }
.tag b { color: var(--primary); }
.chart { position: absolute; left: 72px; right: 72px; top: 230px; bottom: 60px; }
.axis { position: absolute; left: 190px; right: 0; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--bg-light) 0 1px, transparent 1px 106px); opacity: .7; }
.lane { position: absolute; left: 0; right: 0; height: 40px; display: flex; align-items: center; }
.lane > span { width: 190px; font: 15px var(--mono); color: var(--fg); }
.bar { position: absolute; height: 28px; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font: 600 13px var(--mono); color: var(--bg-darkest); }
.ok { background: var(--primary); } .run { background: var(--secondary); } .q { background: transparent; border: 2px dashed var(--bg-lightest); color: var(--dim); } .err { background: var(--accent); }
.now { position: absolute; left: 640px; top: -12px; bottom: -6px; width: 2px; background: var(--cottontail); }
.now::after { content: "now"; position: absolute; top: -20px; left: -12px; font: 13px var(--mono); color: var(--cottontail); }
.fork { position: absolute; left: 190px; top: 98px; height: 152px; border-left: 2px solid var(--bg-lightest); }

</style></head><body>
